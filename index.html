<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Portafolio Dental</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f4f8; color: #333; }
        header { background-color: #0077b6; color: white; padding: 25px; text-align: center; }
        .logo { max-width: 160px; background-color: white; padding: 8px; border-radius: 8px; margin-bottom: 10px; }
        .banner-seccion { text-align: center; margin: 20px 0; }
        .banner-principal { width: 90%; max-width: 950px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .galeria-titulo { text-align: center; color: #0077b6; margin-top: 40px; }
        .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; }
        .tarjeta { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: center; padding: 15px; }
        .tarjeta img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; }
        footer { background-color: #001d3d; color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- CABECERA DE LA PÁGINA (LOGO Y TÍTULO) -->
    <header>
        <img src="img/logo.png" alt="Logo Clínica" class="logo">
        <h1>Clínica Dental - Portafolio de Servicios</h1>
    </header>

    <!-- PORTADA / BANNER PRINCIPAL -->
    <div class="banner-seccion">
        <img src="img/banner_dental.jpg" alt="Bienvenidos" class="banner-principal">
    </div>

    <!-- GALERÍA DE IMÁGENES / SERVICIOS -->
    <h2 class="galeria-titulo">Especialidades Odontológicas</h2>
    <main class="galeria">
        <div class="tarjeta">
            <img src="img/img01.jpg" alt="Atención Profesional">
            <h3>Odontología General</h3>
        </div>
        <div class="tarjeta">
            <img src="img/img02.jpg" alt="Equipamiento">
            <h3>Tecnología Avanzada</h3>
        </div>
        <div class="tarjeta">
            <img src="img/img03.jpg" alt="Cuidado Familiar">
            <h3>Estética Dental</h3>
        </div>
        <div class="tarjeta">
            <img src="img/img04.jpg" alt="Tratamientos">
            <h3>Ortodoncia</h3>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>&copy; 2026 Diseñado para Evaluación de Desarrollo Web - Idat</p>
    </footer>

</body>
</html>
